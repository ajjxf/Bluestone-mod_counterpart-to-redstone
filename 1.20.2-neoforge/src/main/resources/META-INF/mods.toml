modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "BSD-3-Clause"
issueTrackerURL = "https://github.com/ajjxf/Bluestone-mod_counterpart-to-redstone/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
logoFile = "icon.png"

# Dependency range: one jar compiled against 1.20.2/NeoForge 20.2 loads on 1.20.2 - 1.20.6.
[[dependencies.bluestone]]
modId = "neoforge"
mandatory = true
versionRange = "[20.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.bluestone]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.2,1.20.6)"
ordering = "NONE"
side = "BOTH"

# Mixin config (registered here so NeoForge picks it up).
[[mixins]]
config = "bluestone.mixins.json"

# NOTE: AccessTransformer is NOT declared in mods.toml for NeoGradle userdev.
# It is registered via build.gradle: `minecraft.accessTransformers.file ...`
