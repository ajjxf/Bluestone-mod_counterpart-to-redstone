# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_id=bluestone
mod_name=Bluestone
mod_version=1.0.0
mod_group_id=com.bluestone
mod_authors=ajjxf
mod_description=A blue counterpart to redstone. A fully isolated parallel power system that does not interact with redstone.

# Minecraft / NeoForge (compile against the oldest 1.20.x NeoForge line; jar loads 1.20.2-1.20.6)
minecraft_version=1.20.2
# NeoForge for 1.20.2
neo_version=20.2.93
# Range the mod accepts at runtime (declared in mods.toml)
neo_version_range=[20.2,)
minecraft_version_range=[1.20.2,1.20.6)
loader_version_range=[1,)

# JDK
java_version=17
