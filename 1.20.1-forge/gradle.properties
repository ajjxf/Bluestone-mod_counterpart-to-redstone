# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_id=bluestone
mod_name=Bluestone
mod_version=1.0.0
mod_group_id=com.bluestone
mod_authors=ajjxf
mod_description=A blue counterpart to redstone. A fully isolated parallel power system that does not interact with redstone.

# Minecraft / Forge (compile against the oldest 1.20.x Forge line; jar loads 1.20.1 - 1.20.4)
minecraft_version=1.20.1
# Forge for 1.20.1 - stable release line (47.x)
forge_version=47.3.0
# Range the mod accepts at runtime (declared in mods.toml)
minecraft_version_range=[1.20.1,1.20.5)
forge_version_range=[47,)
loader_version_range=[47,)

# JDK
java_version=17
